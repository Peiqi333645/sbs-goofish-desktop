name: Build desktop installers

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - "desktop/**"
      - "src/**"
      - "web-ui/**"
      - "spider_v2.py"
      - "requirements.txt"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
          - name: macOS Apple Silicon
            os: macos-14
            artifact: macos-arm64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: web-ui
        run: npm ci

      - name: Build frontend
        working-directory: web-ui
        run: npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install bundled Chromium
        shell: bash
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/desktop/playwright-browsers"
          python -m playwright install chromium

      - name: Build bundled backend
        run: pyinstaller --noconfirm --clean --distpath backend-dist --workpath backend-build desktop/backend.spec

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: sbs-goofish-${{ matrix.artifact }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 30
